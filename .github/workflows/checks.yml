# 모든 PR에서 실행하는 공통 검사. ruleset의 필수 검사로 등록한다.
# 서비스별 이미지 빌드·배포 workflow는 .github/workflows/<service>.yml에 따로 둔다.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 루트 AGENTS.md "Git 규칙"의 type 목록과 같게 유지한다.
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            build
            ci
            perf

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        run: pipx run zizmor==1.31.1 --format plain .github/workflows
      # 필수 검사 목록을 늘리지 않으려고 Dockerfile 검사도 이 job에서 한다(ci-common.md).
      - name: hadolint
        uses: docker://hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # v2.15.1
        with:
          entrypoint: /bin/hadolint
          args: Dockerfile

  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 실제 Kafka 연결 테스트는 검증·머지된 worker 소스를 고정해 이미지를 빌드한다(ai #34).
      - name: chunk processor integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: p5-3-final/ai
          ref: 5408a90b67f15d3af187d9083709c2c6820db141
          path: .worker-source
          persist-credentials: false
      # 계약 테스트가 서비스 간 계약을 읽는다. docs main이 아니라 service-contracts.lock 버전을 받는다
      # (docs ADR-0013, public 릴리스라 토큰이 필요 없다).
      - name: service contracts
        run: scripts/fetch-service-contracts.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: spotlessCheck
        run: ./gradlew spotlessCheck
      - name: build
        run: ./gradlew build
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/.service-contracts/service-contracts
          CHUNK_PROCESSOR_SOURCE_DIR: ${{ github.workspace }}/.worker-source
