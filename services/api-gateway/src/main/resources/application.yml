spring:
  application:
    name: api-gateway
  # 알림 티켓 1회용 처리(SPEC-001 R-27)와 요청 수 제한에 쓰는 게이트웨이 전용 Redis
  data:
    redis:
      host: ${GATEWAY_REDIS_HOST:localhost}
      port: ${GATEWAY_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          # 서비스 주소는 환경마다 다르다. 기본값은 로컬 compose의 포트(service-catalog.md)다.
          routes:
            # SPEC-001 R-30: 로그인·가입은 IP당 분당 10회로 제한한다. 아래 auth-service 라우트보다 먼저 와야 한다.
            # 토큰 버킷으로 표현한다. 요청마다 6개를 쓰고 초당 1개가 차므로 분당 10회이고, 한 번에 몰아 쓸 수 있는 양도 10회(60개)다.
            - id: auth-rate-limited
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/signup
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 6
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: media-service
              uri: ${MEDIA_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/media/**
            - id: pipeline-service
              uri: ${PIPELINE_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/jobs/**
            - id: analysis-api
              uri: ${ANALYSIS_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/analysis/**
            - id: search-service
              uri: ${SEARCH_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/search/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/notify/**
              # 알림(SSE) 연결은 오래 열려 있어야 하므로 응답 제한 시간을 끈다.
              metadata:
                response-timeout: -1

vlm:
  gateway:
    jwt:
      jwks-uri: ${GATEWAY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${GATEWAY_JWT_ISSUER}
      audience: vlm-api
      ticket-audience: vlm-sse
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
