spring:
  application:
    name: quality-service
  datasource:
    url: ${QUALITY_DB_URL}
    username: ${QUALITY_DB_USERNAME}
    password: ${QUALITY_DB_PASSWORD}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vlm:
  problem:
    validation-error-code: QUALITY_INVALID_REQUEST
  quality:
    storage:
      region: ${QUALITY_S3_REGION}
      # 비우면 SDK가 리전 기본 주소를 쓴다(운영 S3). 로컬은 SeaweedFS 주소를 넣는다(ADR-0006).
      endpoint: ${QUALITY_S3_ENDPOINT:}
      public-endpoint: ${QUALITY_S3_PUBLIC_ENDPOINT:}
      path-style: ${QUALITY_S3_PATH_STYLE:false}
      # 근거 프레임(블러 사본)이 있는 media 버킷. 읽기·서버 쪽 복사만 한다.
      source-bucket: ${QUALITY_SOURCE_BUCKET}
      # Golden Set 확정 버전 버킷. 운영은 Versioning·Object Lock을 켠다(ADR-0011).
      golden-bucket: ${QUALITY_GOLDEN_BUCKET}
      # 화면에 줄 근거 프레임 서명 주소 유효 시간(SPEC-035 R-4)
      signed-url-ttl: 1h
      # 외부 데이터셋 가져오기 버킷(SPEC-030). 매니페스트를 읽기만 한다.
      import-bucket: ${QUALITY_IMPORT_BUCKET:}
      # 특징 내보내기 버킷(SPEC-030 R-14). Golden Set 버킷은 Object Lock이라 쓰지 않는다.
      export-bucket: ${QUALITY_EXPORT_BUCKET:}
    review:
      # 표본 비율(SPEC-029 R-2). 유형별로 sample-rates.<eventType>을 더한다.
      sample-rates:
        default: 0.05
      assignment-timeout: 24h
    golden:
      # Pod가 죽어 남은 확정 진행 표시를 무시하는 시간(R-15)
      freeze-lock-timeout: 30m
    gate:
      tolerance: 0.02
    internal:
      allowed-callers: ${QUALITY_INTERNAL_ALLOWED_CALLERS:quality-eval}
    stage:
      retention: 90d
    export:
      # 이보다 오래 작업 표시가 없으면 Pod가 죽은 것으로 보고 다른 작업자가 처음부터 다시 쓴다.
      # 결과 파일 하나를 읽고 쓰는 시간보다 충분히 길어야 한다.
      heartbeat-timeout: 5m
    dataset:
      # 받을 매니페스트 taxonomyVersion(R-2)
      supported-taxonomy-versions: [v2]
      # 이보다 오래 작업 표시가 없으면 Pod가 죽은 것으로 보고 다른 작업자가 이어받는다.
      # media 호출 한 건(read 60s × 3회)보다 길어야 한다.
      heartbeat-timeout: 5m
    media:
      # media-service 내부 주소(SPEC-030 R-4)
      base-url: ${MEDIA_SERVICE_INTERNAL_URI:http://localhost:8082}
      connect-timeout: 2s
      # 서버 쪽 복사 시간. X-Request-Deadline도 이 값으로 정한다.
      read-timeout: 60s
      # 503·연결 실패·시간 초과에 2회 재시도(내부 호출 규약)
      max-attempts: 3
      retry-wait: 500ms
      circuit-minimum-calls: 10
      circuit-open-duration: 30s
    consumers-enabled: true
    jobs:
      scheduling-enabled: true
