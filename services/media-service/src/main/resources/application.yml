spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL}
    username: ${MEDIA_DB_USERNAME}
    password: ${MEDIA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Outbox 발행이 "전송 확인"을 기다리므로 모든 복제본 기록을 확인한다.
      acks: all

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vlm:
  problem:
    validation-error-code: MEDIA_INVALID_REQUEST
  media:
    internal:
      # 내부 경로(/internal/**) 호출자 허용 목록(SPEC-030 R-6)
      allowed-callers: ${MEDIA_INTERNAL_ALLOWED_CALLERS:quality-service}
    dataset:
      # X-Request-Deadline이 없을 때 데이터셋 영상 등록 한 건의 제한 시간(SPEC-030, C-33). quality의 read 타임아웃(60s)과 맞춘다.
      default-timeout: 60s
    retention:
      # 보존 키 비밀 키(Base64, 32바이트 이상). 기본값을 두지 않아 없으면 기동에 실패한다(SPEC-018 R-12).
      hmac-key: ${MEDIA_RETENTION_HMAC_KEY}
    storage:
      bucket: ${MEDIA_S3_BUCKET}
      region: ${MEDIA_S3_REGION}
      # 비우면 SDK가 리전 기본 주소를 쓴다(운영 S3). 로컬은 SeaweedFS 주소를 넣는다(ADR-0006).
      endpoint: ${MEDIA_S3_ENDPOINT:}
      public-endpoint: ${MEDIA_S3_PUBLIC_ENDPOINT:}
      path-style: ${MEDIA_S3_PATH_STYLE:false}
      # 외부 데이터셋 가져오기 버킷(SPEC-030 R-5). 읽기·서버 쪽 복사만 한다.
      import-bucket: ${MEDIA_IMPORT_S3_BUCKET:}
    normalization:
      # 영상 1초당 예상 처리 초(SPEC-007 R-20). 처리 실측 전 임시값이며 측정한 뒤 바꾼다.
      estimate-factor: 1.0
      # video.normalizing·video.normalized 수신. 끄면 영상이 UPLOADED에 머문다.
      consumer-enabled: true
