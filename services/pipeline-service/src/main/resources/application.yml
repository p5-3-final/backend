spring:
  application:
    name: pipeline-service
  datasource:
    url: ${PIPELINE_DB_URL}
    username: ${PIPELINE_DB_USERNAME}
    password: ${PIPELINE_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs

pipeline:
  intake:
    enabled: ${PIPELINE_INTAKE_ENABLED:false}
    group-id: ${PIPELINE_INTAKE_GROUP_ID:pipeline-normalized-intake-v2}
    profile-version: ${PIPELINE_INTAKE_PROFILE_VERSION:}
    mode: ${PIPELINE_INTAKE_MODE:production}
    inference-profile-version: ${PIPELINE_INTAKE_INFERENCE_PROFILE_VERSION:}
    max-duration-ms: ${PIPELINE_INTAKE_MAX_DURATION_MS:14400000}
    retry-interval-ms: ${PIPELINE_INTAKE_RETRY_INTERVAL_MS:1000}
    retry-attempts: ${PIPELINE_INTAKE_RETRY_ATTEMPTS:2}

  results:
    enabled: ${PIPELINE_RESULTS_ENABLED:false}
    group-id: ${PIPELINE_RESULTS_GROUP_ID:pipeline-execution-results-v1}

  execution:
    reconciliation-enabled: ${PIPELINE_EXECUTION_RECONCILIATION_ENABLED:false}
    interval-ms: ${PIPELINE_EXECUTION_INTERVAL_MS:30000}
    batch-size: ${PIPELINE_EXECUTION_BATCH_SIZE:100}
    max-attempts: ${PIPELINE_EXECUTION_MAX_ATTEMPTS:1}
    retryable-error-codes: ${PIPELINE_EXECUTION_RETRYABLE_ERROR_CODES:}
    retry-delay-ms: ${PIPELINE_EXECUTION_RETRY_DELAY_MS:1000}

  dispatch:
    enabled: ${PIPELINE_DISPATCH_ENABLED:false}
    user-limit: ${PIPELINE_DISPATCH_USER_LIMIT:2}
    source-limit: ${PIPELINE_DISPATCH_SOURCE_LIMIT:1}
    global-limit: ${PIPELINE_DISPATCH_GLOBAL_LIMIT:4}
    start-window-ms: ${PIPELINE_DISPATCH_START_WINDOW_MS:300000}
    interval-ms: ${PIPELINE_DISPATCH_INTERVAL_MS:1000}
    batch-size: ${PIPELINE_DISPATCH_BATCH_SIZE:100}
vlm:
  outbox:
    scheduling-enabled: ${PIPELINE_DISPATCH_ENABLED:false}
