spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  # api-gateway가 붙인 X-Forwarded-For로 클라이언트 IP를 읽는다. 게이트웨이 외 접근은 NetworkPolicy로 막는다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vlm:
  problem:
    validation-error-code: AUTH_INVALID_REQUEST
  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER}
      audience: vlm-api
      signing-key: ${AUTH_JWT_SIGNING_KEY}
      previous-public-keys: ${AUTH_JWT_PREVIOUS_PUBLIC_KEYS:}
    # 비어 있으면 초기 관리자를 만들지 않고 경고만 남긴다(로컬 편의).
    admin:
      email: ${AUTH_ADMIN_EMAIL:}
      password: ${AUTH_ADMIN_PASSWORD:}
