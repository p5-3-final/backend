# 의존성 버전은 이 파일에서만 관리한다.
[versions]
java = "21"
spring-boot = "3.5.16"
spring-cloud = "2025.0.3"
spring-dependency-management = "1.1.7"
spotless = "8.10.4"
google-java-format = "1.36.0"  # 1.37.0은 JDK 21 데몬에서 포맷 실패(InvocationTargetException)
ktlint = "1.8.0"
errorprone-plugin = "5.2.0"
errorprone = "2.51.0"
nullaway = "0.14.3"
lombok = "1.18.48"
archunit = "1.5.1"
jspecify = "1.0.1"
wiremock = "3.13.2"
swagger-request-validator = "2.46.1"  # 3.x는 Spring 7 기반
aws-sdk = "2.57.8"
json-schema-validator = "1.5.9"  # 2.x부터 Jackson 3(tools.jackson) 기반이라 Boot 3.5의 Jackson 2와 맞지 않는다
openapi-generator = "7.27.0"
# Testcontainers·spring-kafka는 Spring Boot BOM이 관리한다(3.5.16 → Testcontainers 1.21.4).

[libraries]
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
swagger-request-validator-mockmvc = { module = "com.atlassian.oai:swagger-request-validator-mockmvc", version.ref = "swagger-request-validator" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

# build-logic의 convention plugin이 쓰는 Gradle 플러그인
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

[plugins]
# 서비스 API 인터페이스·모델을 계약(OpenAPI)에서 빌드 때 생성한다(SPEC-029 plan "openapi-generator 설정").
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
