# 의존성 버전은 이 파일에서만 관리한다.
[versions]
java = "21"
spring-boot = "3.5.16"
spring-cloud = "2025.0.3"
spring-dependency-management = "1.1.7"
spotless = "8.10.4"
google-java-format = "1.36.0"  # 1.37.0은 JDK 21 데몬에서 포맷 실패(InvocationTargetException)
ktlint = "1.8.0"
errorprone-plugin = "5.2.0"
errorprone = "2.51.0"
nullaway = "0.14.3"
lombok = "1.18.48"
archunit = "1.5.1"

[libraries]
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# build-logic의 convention plugin이 쓰는 Gradle 플러그인
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
