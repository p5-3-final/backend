# 커밋 전 빠른 검사. 관문은 CI이며 같은 검사를 전체 대상으로 다시 실행한다.
pre-commit:
  parallel: true
  jobs:
    - name: spotless
      glob: "*.{java,kts}"
      run: ./gradlew spotlessCheck --quiet
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
